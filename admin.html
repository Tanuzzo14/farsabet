<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarsaBet – Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <a class="logo" href="index.html">
      <span class="logo-text">FARSABET</span>
      <span class="badge-premium">Admin</span>
    </a>
    <div class="header-subtitle">Login Amministratore</div>
  </div>
</header>

<div class="admin-gate">
  <div class="admin-card">
    <div class="admin-card-title">🔒 Accesso Admin</div>
    <p class="admin-card-sub">Inserisci la password per accedere alla pagina di gestione dati.</p>
    <form id="gate-form">
      <div class="form-group">
        <label for="inp-pass">Password</label>
        <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-confirm">Entra</button>
    </form>
    <div id="gate-error" class="admin-error" hidden>❌ Password errata.</div>
  </div>
</div>

<script src="admin-login.js"></script>
</body>
</html>
